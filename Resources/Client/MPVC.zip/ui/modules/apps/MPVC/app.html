<div id="mpvc-root">
  <link rel="stylesheet" href="/ui/modules/apps/MPVC/app.css"/>

  <div class="mpvc-speakers" ng-if="speakersList.length > 0">
    <div class="mpvc-speaker"
         ng-class="['mpvc-' + youState, {'mpvc-speaking': localSpeaking}]">
      <span class="mpvc-sdot">●</span>
      <span>You</span>
    </div>
    <div class="mpvc-speaker"
         ng-class="['mpvc-' + p.state, {'mpvc-muted': p.muted, 'mpvc-speaking': p.speaking}]"
         ng-click="toggleMute(p.pid)"
         ng-repeat="p in speakersList">
      <span class="mpvc-sdot">●</span>
      <span>{{p.name}}</span>
    </div>
  </div>

  <div class="pv-bar">
    <button class="pv-btn pv-btn-talk"
            ng-class="{'pv-active-talk': mode === 'talk'}"
            ng-click="talkToggle()"
            title="Talk & Listen">
      <span class="pv-icon">🎙️</span>
    </button>
    <button class="pv-btn pv-btn-listen"
            ng-class="{'pv-active-listen': mode === 'listen'}"
            ng-click="listenToggle()"
            title="Listen Only">
      <span class="pv-icon">🔊</span>
    </button>
    <span class="pv-badge" ng-if="nearbyCount > 0">{{nearbyCount}}</span>
  </div>

  <div class="mpvc-card" ng-if="showChoice || showDownloads">

    <div ng-if="showChoice">
      <div class="mpvc-c-row mpvc-c-header">
        <span>🎙️ <strong>Proximity Voice Chat</strong></span>
        <button class="mpvc-x" ng-click="dismissChoice()">×</button>
      </div>
      <p class="mpvc-c-text">
        This server supports proximity voice chat.<br>
        How would you like to participate?
      </p>
      <div class="mpvc-c-downloads">
        <button class="mpvc-btn mpvc-dl-btn" ng-click="chooseApp()">
          📥 Install MicBridge
          <br><small style="color:#777;font-size:10px">One-time download</small>
        </button>
        <button class="mpvc-btn mpvc-dl-btn" ng-click="chooseBrowser()">
          🌐 Use Browser
          <br><small style="color:#777;font-size:10px">No install needed</small>
        </button>
      </div>
      <label class="mpvc-c-check">
        <input type="checkbox" ng-model="rememberChoice" />
        Remember my choice
      </label>
      <label class="mpvc-c-check">
        <input type="checkbox" ng-model="dontRemind" />
        Don't remind me again
      </label>
      <div class="mpvc-c-row mpvc-c-actions">
        <button class="mpvc-btn mpvc-btn-no" ng-click="dismissChoice()">No thanks</button>
      </div>
    </div>

    <div ng-if="showDownloads">
      <div class="mpvc-c-row mpvc-c-header">
        <span>⬇️ <strong>Download MicBridge</strong></span>
        <button class="mpvc-x" ng-click="closeDownloads()">×</button>
      </div>
      <div class="mpvc-c-downloads">
        <button class="mpvc-btn mpvc-dl-btn" ng-click="downloadGithub()">⬇ GitHub</button>
        <button class="mpvc-btn mpvc-dl-btn mpvc-dl-discord"
                ng-if="discordEnabled"
                ng-click="downloadDiscord()">💬 Discord</button>
      </div>
      <p class="mpvc-c-note">Run <strong>MPVC.exe</strong> then reconnect to the server.</p>
    </div>

  </div>

</div>
